[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfmap"
version = "0.1.0"
description = "Bounded Normalizing Flow Maps for Dimensionality Reduction"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "scikit-learn",
    "pynndescent",
    "tqdm"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nfmap*"]
